server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dashboard as a static copy: /app serves the SPA, which seeds #/app
    # from the pathname on load.
    location = /app {
        return 301 /app/;
    }
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Optional: proxy API through the same origin (avoids CORS when the
    # browser can reach the backend only via this host). The app itself
    # calls VITE_API_URL directly by default.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
