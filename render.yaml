# Render Blueprint — one-click backend deploy for A.A.R.A.M.B.H (SIH26084)
#
# How to use:
#   1. Push this file to the repo root (same level as README.md, docker-compose.yml).
#   2. On https://render.com -> New -> Blueprint -> connect this GitHub repo.
#   3. Render reads this file automatically and creates the web service below.
#   4. After it deploys, copy the service URL (looks like
#      https://aarambh-backend-XXXX.onrender.com) and set it as VITE_API_URL
#      in the Vercel project's Environment Variables, then redeploy the frontend.
#
# Notes:
#   - Free tier spins down after 15 min idle and takes ~30-50s to wake on the
#     next request (first hazard load after idle will be slow — this is
#     normal Render free-tier behaviour, not a bug).
#   - SQLite (cycles.db, bhoomi_rakshak.db) lives on ephemeral disk on the
#     free tier: it resets on every redeploy/restart. Fine for a demo; add a
#     persistent disk (paid) or swap to a managed Postgres later if the data
#     needs to survive restarts.

services:
  - type: web
    name: aarambh-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BH_CYCLE_INTERVAL_S
        value: "300"
    autoDeployTrigger: commit
